<svg width="680" viewBox="0 0 680 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GamingMaster model architecture</title>
<desc>Board sequence and global stats are encoded and merged into 627 tokens per frame, pass through three spatiotemporal blocks (spatial self-attention, gated linear recurrence, feed-forward) with a next-observation side head, then the TRM pondering core, and finally five autoregressive decoder heads.</desc>
<style>
  .t14 { font: 500 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t12 { font: 400 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
  .box { fill: #f6f8fa; stroke: #8b949e; stroke-width: 0.75; }
  .blue { fill: #ddf4ff; stroke: #218bff; stroke-width: 0.75; }
  .purple { fill: #fbefff; stroke: #a475f9; stroke-width: 0.75; }
  .cont { fill: none; stroke: #8b949e; stroke-width: 0.75; stroke-dasharray: 4 3; }
  .arr { stroke: #59636e; stroke-width: 1.25; fill: none; }
  @media (prefers-color-scheme: dark) {
    .t14 { fill: #e6edf3; }
    .t12 { fill: #9198a1; }
    .box { fill: #1c2128; stroke: #59636e; }
    .blue { fill: #122d4d; stroke: #4493f8; }
    .purple { fill: #2b2039; stroke: #986ee2; }
    .cont { stroke: #59636e; }
    .arr { stroke: #9198a1; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="60" y="40" width="230" height="46" rx="4"/>
<text class="t14" x="175" y="59" text-anchor="middle">grid_seq</text>
<text class="t12" x="175" y="76" text-anchor="middle">[B, T, 12, 25, 25]</text>
<rect class="box" x="350" y="40" width="230" height="46" rx="4"/>
<text class="t14" x="465" y="59" text-anchor="middle">globals_seq</text>
<text class="t12" x="465" y="76" text-anchor="middle">[B, T, 4]</text>

<line class="arr" x1="175" y1="86" x2="175" y2="108" marker-end="url(#arrow)"/>
<line class="arr" x1="465" y1="86" x2="465" y2="108" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="110" width="230" height="46" rx="4"/>
<text class="t14" x="175" y="129" text-anchor="middle">SpatialEncoder</text>
<text class="t12" x="175" y="146" text-anchor="middle">conv + residual blocks · ~4.0M</text>
<rect class="box" x="350" y="110" width="230" height="46" rx="4"/>
<text class="t14" x="465" y="129" text-anchor="middle">global_proj</text>
<text class="t12" x="465" y="146" text-anchor="middle">MLP 4 → 384</text>

<line class="arr" x1="175" y1="156" x2="245" y2="188" marker-end="url(#arrow)"/>
<line class="arr" x1="465" y1="156" x2="360" y2="188" marker-end="url(#arrow)"/>

<rect class="box" x="130" y="190" width="340" height="50" rx="4"/>
<text class="t14" x="300" y="210" text-anchor="middle">627 tokens / frame</text>
<text class="t12" x="300" y="228" text-anchor="middle">625 spatial + HL + LL · 2D positional encoding</text>

<line class="arr" x1="300" y1="240" x2="300" y2="268" marker-end="url(#arrow)"/>

<rect class="cont" x="110" y="270" width="380" height="200" rx="6"/>
<text class="t12" x="124" y="290">Stage 1 · spatiotemporal encoding × 3 layers · ~5.9M</text>
<rect class="blue" x="140" y="300" width="320" height="42" rx="4"/>
<text class="t14" x="300" y="318" text-anchor="middle">Spatial self-attention</text>
<text class="t12" x="300" y="334" text-anchor="middle">627 tokens attend within each frame</text>
<line class="arr" x1="300" y1="342" x2="300" y2="350" marker-end="url(#arrow)"/>
<rect class="blue" x="140" y="352" width="320" height="54" rx="4"/>
<text class="t14" x="300" y="372" text-anchor="middle">Gated linear recurrence</text>
<text class="t12" x="300" y="390" text-anchor="middle">fixed-size memory per token · half-lives 1→1024</text>
<line class="arr" x1="300" y1="406" x2="300" y2="414" marker-end="url(#arrow)"/>
<rect class="blue" x="140" y="416" width="320" height="42" rx="4"/>
<text class="t14" x="300" y="434" text-anchor="middle">Feed-forward</text>
<text class="t12" x="300" y="450" text-anchor="middle">3 residual + LayerNorm sites</text>

<line class="arr" x1="490" y1="379" x2="513" y2="379" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect class="box" x="515" y="352" width="125" height="54" rx="4"/>
<text class="t14" x="577" y="374" text-anchor="middle">next_obs_head</text>
<text class="t12" x="577" y="392" text-anchor="middle">predicts next frame</text>

<line class="arr" x1="300" y1="470" x2="300" y2="496" marker-end="url(#arrow)"/>

<rect class="cont" x="110" y="498" width="380" height="116" rx="6"/>
<text class="t12" x="124" y="518">Stage 2 · TRM pondering core · H3 × L6 recursion · ~4.1M</text>
<rect class="purple" x="150" y="528" width="140" height="44" rx="4"/>
<text class="t14" x="220" y="546" text-anchor="middle">z_L scratchpad</text>
<text class="t12" x="220" y="562" text-anchor="middle">reasoning state</text>
<rect class="purple" x="310" y="528" width="140" height="44" rx="4"/>
<text class="t14" x="380" y="546" text-anchor="middle">z_H answer</text>
<text class="t12" x="380" y="562" text-anchor="middle">q_halt (ACT)</text>
<line class="arr" x1="290" y1="540" x2="308" y2="540" marker-end="url(#arrow)"/>
<line class="arr" x1="310" y1="560" x2="292" y2="560" marker-end="url(#arrow)"/>
<text class="t12" x="300" y="596" text-anchor="middle">shared 3-block module · no-grad prefix + full-grad final cycle</text>

<line class="arr" x1="300" y1="614" x2="300" y2="628" marker-end="url(#arrow)"/>

<rect class="cont" x="40" y="630" width="600" height="94" rx="6"/>
<text class="t12" x="54" y="650">Autoregressive decoder heads · ~1.8M</text>
<rect class="box" x="52" y="662" width="104" height="48" rx="4"/>
<text class="t14" x="104" y="682" text-anchor="middle">Source</text>
<text class="t12" x="104" y="698" text-anchor="middle">legal mask</text>
<line class="arr" x1="156" y1="686" x2="168" y2="686" marker-end="url(#arrow)"/>
<rect class="box" x="170" y="662" width="104" height="48" rx="4"/>
<text class="t14" x="222" y="682" text-anchor="middle">Direction</text>
<text class="t12" x="222" y="698" text-anchor="middle">4 directions</text>
<line class="arr" x1="274" y1="686" x2="286" y2="686" marker-end="url(#arrow)"/>
<rect class="box" x="288" y="662" width="104" height="48" rx="4"/>
<text class="t14" x="340" y="682" text-anchor="middle">Split</text>
<text class="t12" x="340" y="698" text-anchor="middle">half army</text>
<line class="arr" x1="392" y1="686" x2="404" y2="686" marker-end="url(#arrow)"/>
<rect class="box" x="406" y="662" width="104" height="48" rx="4"/>
<text class="t14" x="458" y="682" text-anchor="middle">Pass</text>
<text class="t12" x="458" y="698" text-anchor="middle">no-op</text>
<rect class="box" x="524" y="662" width="104" height="48" rx="4"/>
<text class="t14" x="576" y="682" text-anchor="middle">Value</text>
<text class="t12" x="576" y="698" text-anchor="middle">win estimate</text>
</svg>
