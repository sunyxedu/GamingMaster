[project]
name = "gaming-master"
version = "0.1.0"
description = "Generals.io replay data processing and ML training"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "aiohttp>=3.9.0",
    # numpy 2.x linux wheels require the x86-64-v2 CPU baseline, which the
    # cluster's login/cpu nodes lack; 1.26 wheels run anywhere. Python 3.13+
    # (dev machines) has no 1.26 wheels, so it keeps 2.x.
    "numpy>=1.24.0,<2; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "matplotlib>=3.10.8",
    "lzstring>=1.0.4",
    "python-chess>=1.999",
    "python-shogi>=1.1.1",
    "zstandard>=0.25.0",
]

[project.scripts]
prepare-data = "scripts.prepare_data:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_processing", "scripts", "model"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
