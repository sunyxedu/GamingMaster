[project]
name = "gaming-master"
version = "0.1.0"
description = "Game agents with neural training and Astra/Jev Meta-Harness control"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "aiohttp>=3.9.0",
    # numpy 2.x linux wheels require the x86-64-v2 CPU baseline, which the
    # cluster's login/cpu nodes lack; 1.26 wheels run anywhere. Python 3.13+
    # (dev machines) has no 1.26 wheels, so it keeps 2.x.
    "numpy>=1.24.0,<2; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "matplotlib>=3.10.8",
    "lzstring>=1.0.4",
    "zstandard>=0.25.0",
    "tomli>=2.0; python_version < '3.11'",  # model profiles on Python 3.10
    # gmrules simulators / replay (PyO3 extension built from source by maturin on
    # `uv sync`; needs cargo on PATH — data_processing/rs/gmsim/README.md)
    "gmsim",
]

[project.optional-dependencies]
# ARC-AGI-3 offline SDK: the tier-1 adapter (metaharness/testbeds/arc3.py) and the tier-3
# env (env/vec_arc3.py) + solver (scripts/arc3_solve.py); pinned to the cached games' SDK
arc3 = ["arc-agi==0.9.9; python_version >= '3.12'", "arcengine==0.9.3; python_version >= '3.12'"]
# Lux AI S3 simulator (env/vec_lux.py): the official JAX env, pinned to the rules
# the Kaggle competition ran (= kaggle-environments 1.17.2's vendored copy)
lux = ["luxai-s3==0.2.1"]

[tool.uv.sources]
gmsim = { path = "data_processing/rs/gmsim" }

[project.scripts]
prepare-data = "scripts.prepare_data:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    # rules references for the converter tests (tests/test_chess_converter.py,
    # test_shogi_converter.py, test_audit_board_causality.py) and scripts/quality_by_rating.py;
    # the model, envs and trainers play through gmrules (Rust) and never import them
    "python-chess>=1.999",
    "python-shogi>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_processing", "env", "model", "metaharness", "scripts", "training"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
