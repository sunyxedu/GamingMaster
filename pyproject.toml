[project]
name = "gaming-master"
version = "0.1.0"
description = "Generals.io replay data processing and ML training"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "matplotlib>=3.10.8",
]

[project.scripts]
prepare-data = "scripts.prepare_data:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_processing", "scripts", "model"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
