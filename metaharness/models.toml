# Model profiles. A profile = a backend (how to reach a model) + a model id + options.
# Backends: "codex" (codex CLI, ~/.codex login), "claude" (claude CLI login),
#           "typesafe" (Jev HTTP API, TYPESAFE_API_KEY in .env),
#           "scripted" / "heuristic" (offline stand-ins for tests).
# Select with --system2 <profile> / --proposer <profile> / --system1 <profile>.
# Override the file with METAHARNESS_MODELS=/path/to/models.toml.
#
# A codex profile may name a provider: an OpenAI-compatible endpoint (Responses API) reached with an
# API key from the environment variable it names, instead of the codex CLI's ChatGPT login. The
# "router" below is the local model router Claude Code on this machine uses (its settings.json env:
# ANTHROPIC_BASE_URL = http://127.0.0.1:8787, the same token); codex runs with its own CODEX_HOME.

[providers.router]
name = "appintheloop router"
base_url = "http://127.0.0.1:8799/v1"   # queueing proxy (~/mh-proxy) in front of the router at 8787
env_key = "MH_ROUTER_API_KEY"       # the key itself lives in .env, never here
wire_api = "responses"
codex_home = "~/.cache/metaharness/codex-home"
max_concurrent = 8                  # codex processes on this endpoint at a time, across all our processes
                                    # (the router caps requests per minute per user; 429s are retried)

[system2.astra]
backend = "codex"
model = "gpt-6-astra"
reasoning_effort = "high"
provider = "router"

[system2.astra-login]                # the codex CLI's own ChatGPT login (needs `codex login`)
backend = "codex"
model = "gpt-6-astra"
reasoning_effort = "high"

[system2.sol]
backend = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"
provider = "router"

[system2.claude]
backend = "claude"
model = ""                 # empty = the claude CLI's configured default model

[system2.claude-opus]
backend = "claude"
model = "claude-opus-5"

[system2.scripted]
backend = "scripted"

[system1.jev]
backend = "typesafe"
model = "jev-latest"

[system1.heuristic]
backend = "heuristic"
