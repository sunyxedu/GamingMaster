[package]
name = "sc2api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "StarCraft II API client: the game's protobuf protocol over its websocket, a headless SC2 process per client"

[dependencies]
anyhow.workspace = true
prost = "0.14"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"
