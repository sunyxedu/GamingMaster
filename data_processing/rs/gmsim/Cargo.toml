[package]
name = "gmsim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GamingMaster batched simulators of gmrules games as a Python extension (PyO3, abi3)"

[lib]
# the extension module `gmsim._native` (Python package: python/gmsim)
name = "_native"
crate-type = ["cdylib"]

[dependencies]
gmrules = { path = "../gmrules" }
# riichi mahjong (not a gmrules game: its own batched simulator, env/vec_mahjong.py)
gmmahjong = { path = "../gmmahjong" }
# Pokémon Showdown frames of live requests (env/vec_pokemon.py; the battles run in Showdown)
gmpokemon = { path = "../gmpokemon" }
# StarCraft II against the built-in AI (env/vec_sc2.py; SC2 processes of the install)
gmsc2 = { path = "../gmsc2" }
# Clash Royale frames of a live battle (env/vec_cr.py; the battles run in RoyaleSim) — the
# converter's frame builder without its IO
crdata = { path = "../../games/clash_royale/crdata", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json.workspace = true
# (no `extension-module` feature: maturin sets PYO3_BUILD_EXTENSION_MODULE, pyo3 >= 0.26)
