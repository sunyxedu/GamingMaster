[package]
name = "gmsim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GamingMaster batched simulators of gmrules games as a Python extension (PyO3, abi3)"

[lib]
# the extension module `gmsim._native` (Python package: python/gmsim)
name = "_native"
crate-type = ["cdylib"]

[dependencies]
gmrules = { path = "../gmrules" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json.workspace = true

[features]
# enabled by maturin (pyproject.toml): no libpython link for the extension module
extension-module = ["pyo3/extension-module"]
