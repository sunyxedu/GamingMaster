[package]
name = "gmtetris"
version = "0.1.0"
edition = "2021"
publish = false
# our code: Apache-2.0; it LINKS Cold Clear (MPL-2.0, unmodified, pinned below), so the
# binary carries MPL-2.0 files (fine in-house; distributing it means MPL terms for them)
license = "Apache-2.0"
description = "Versus-Tetris self-play with the Cold Clear bot on the gmrules tetris game: trajectory JSONL for `gmdata rules convert --game tetris`"

[[bin]]
name = "gmtetris"
path = "src/main.rs"

[dependencies]
gmrules = { path = "../gmrules" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
flate2 = "1"
# Cold Clear (MinusKelvin, MPL-2.0): the teacher, at its last commit (2022-01-18)
cold-clear = { git = "https://github.com/MinusKelvin/cold-clear", rev = "279edd7c3177ff8077f6a930193397814b281f27" }
libtetris = { git = "https://github.com/MinusKelvin/cold-clear", rev = "279edd7c3177ff8077f6a930193397814b281f27" }

# its own workspace (see ../../Cargo.toml)
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
