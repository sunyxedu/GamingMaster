[package]
name = "gmdata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GamingMaster data pipelines: fetch, simulate and convert game records into training shards"

[[bin]]
name = "gmdata"
path = "src/main.rs"

[dependencies]
gmshard = { path = "../gmshard" }
gmrules = { path = "../gmrules" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
reqwest.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
bzip2 = "0.4"
tar = "0.4"
shakmaty = "0.30.1"
pgn-reader = "0.29.0"
zstd = "0.14.0"
sevenz-rust = "0.6.1"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2"] }
arrow-array = "54"
crc32fast = "1.5.2"
arrow-cast = "54"
arrow-schema = "54"
