[package]
name = "gmdata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GamingMaster data pipelines: fetch, simulate and convert game records into training shards"

[[bin]]
name = "gmdata"
path = "src/main.rs"

[dependencies]
gmshard = { path = "../gmshard" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
reqwest.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
bzip2 = "0.4"
tar = "0.4"
shakmaty = "0.30.1"
pgn-reader = "0.29.0"
zstd = "0.14.0"
