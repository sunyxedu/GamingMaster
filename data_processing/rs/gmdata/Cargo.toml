[package]
name = "gmdata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GamingMaster data pipelines: fetch, simulate and convert game records into training shards"

[[bin]]
name = "gmdata"
path = "src/main.rs"

[features]
# Honor of Kings: the Hokoff HDF5 datasets (gmdata hok convert); HDF5 is built from source
# (static, with its zlib filter), no system library needed
hok = ["dep:hdf5"]

[dependencies]
hdf5 = { package = "hdf5-metno", version = "0.15", optional = true, features = ["static", "zlib"] }
gmshard = { path = "../gmshard" }
gmrules = { path = "../gmrules" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
reqwest.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
bzip2 = "0.4"
tar = "0.4"
shakmaty = "0.30.1"
pgn-reader = "0.29.0"
zstd = "0.14.0"
sevenz-rust = "0.6.1"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2"] }
arrow-array = "54"
arrow-cast = "54"
arrow-schema = "54"
# riichi mahjong hand evaluation (yaku / yakuman) for exact hora legality; Apache-2.0,
# https://github.com/smly/RiichiEnv (default features only: no Python bindings)
riichienv-core = "=0.4.10"
encoding_rs = "0.8"
