[workspace]
resolver = "2"
members = [
    "rs/gmshard",
    "rs/gmdata",
    "games/clash_royale/crdata",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
