[workspace]
resolver = "2"
members = [
    "rs/gmshard",
    "rs/sc2api",
    "rs/gmrules",
    "rs/gmdata",
    "rs/gmsim",
    "games/clash_royale/crdata",
]
# `cargo build|test` without -p: everything but the PyO3 extension (gmsim is
# built by maturin through `uv sync`, see rs/gmsim/README.md; its logic is
# tested in gmrules and from Python)
default-members = [
    "rs/gmshard",
    "rs/sc2api",
    "rs/gmrules",
    "rs/gmdata",
    "games/clash_royale/crdata",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
