[package]
name = "crdata"
version = "0.1.0"
edition.workspace = true
description = "Clash Royale replay → training-frame converter (RoyaleAPI action replays → per-side decision frames)"
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "crdata"
path = "src/main.rs"
required-features = ["io"]

[features]
# the converter's IO (Parquet, the Hugging Face fetch, gm-shards); the frame builder alone
# (gmsim's live frames) is `default-features = false`
default = ["io"]
io = ["dep:gmshard", "dep:clap", "dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:rayon", "dep:sha2",
      "dep:hex", "dep:reqwest"]

[dependencies]
gmshard = { path = "../../../rs/gmshard", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2"], optional = true }
arrow-array = { version = "54", optional = true }
arrow-schema = { version = "54", optional = true }
rayon = { version = "1.10", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
