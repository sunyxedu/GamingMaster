[package]
name = "crdata"
version = "0.1.0"
edition.workspace = true
description = "Clash Royale replay → training-frame converter (RoyaleAPI action replays → per-side decision frames)"
license.workspace = true
publish.workspace = true

[[bin]]
name = "crdata"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2"] }
arrow-array = "54"
arrow-schema = "54"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
