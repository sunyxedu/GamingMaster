<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="640" viewBox="0 0 2000 640" role="img"><title>GamingMaster data and training pipeline</title><desc>Records of strong play are parsed, replayed and verified by one Rust rule engine (gmrules) that encodes IL frames into memory-mapped gm-shards, optionally with engine soft targets; the same encoders drive the RL simulators. Stage 1 trains the whole multi-game network with joint imitation learning; Stage 2 continues with mixed-game PPO on the whole model with an IL/KL replay stream; the result is one network for every game with no search and no per-game post-training.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d74d9"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><linearGradient id="lat" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7fb6ff"/><stop offset="0.5" stop-color="#4a7fd4"/><stop offset="1" stop-color="#e5382e"/></linearGradient></defs><rect width="2000" height="640" fill="#ffffff"/><text x="160" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328" text-anchor="middle">Records</text>
<text x="470" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328" text-anchor="middle">One rule engine</text>
<text x="745" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328" text-anchor="middle">gm-shards</text>
<text x="1040" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328" text-anchor="middle">Stage 1 · joint IL</text>
<text x="1500" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328" text-anchor="middle">Stage 2 · mixed-game RL</text>
<text x="1880" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328" text-anchor="middle">One model</text>
